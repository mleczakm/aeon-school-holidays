name: Release

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            - run: npm ci

            - env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
