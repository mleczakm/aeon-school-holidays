name: Update MEN school holidays

on:
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:
        inputs:
            since:
                description: Optional ISO-8601 lower bound instead of the last successful run
                required: false
                type: string

concurrency:
    group: update-men-school-holidays
    cancel-in-progress: false

permissions:
    actions: read
    contents: write
    issues: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            UPDATE_BRANCH: automation/men-school-holidays

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Continue the existing update branch when present
              run: |
                  git fetch origin "$UPDATE_BRANCH" || true
                  if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH"; then
                      git checkout -B "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
                      git rebase "origin/${{ github.event.repository.default_branch }}"
                  else
                      git checkout -b "$UPDATE_BRANCH"
                  fi

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - uses: ramsey/composer-install@v3

            - name: Resolve the scan lower bound
              id: window
              env:
                  MANUAL_SINCE: ${{ inputs.since }}
              run: |
                  since="$MANUAL_SINCE"
                  if [ -z "$since" ]; then
                      since=$(gh api \
                          "repos/${{ github.repository }}/actions/workflows/update-men-school-holidays.yml/runs?status=success&per_page=1" \
                          --jq '.workflow_runs[0].updated_at // empty')
                  fi
                  if [ -z "$since" ]; then
                      since=$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')
                  fi
                  echo "since=$since" >> "$GITHUB_OUTPUT"
                  echo "Scanning MEN messages published after $since"

            - name: Read MEN feeds and update the dataset
              run: composer update-men -- --since="${{ steps.window.outputs.since }}"

            - name: Verify generated data
              run: composer qa

            - name: Add report to the workflow summary
              run: |
                  {
                      echo '## MEN school-holiday scan'
                      echo
                      echo "Lower bound: \`${{ steps.window.outputs.since }}\`"
                      echo
                      jq -r '"Scanned: \(.scanned_items); relevant: \(.relevant_items | length); dataset changed: \(.dataset_changed); review required: \(.requires_review)."' build/men-update-report.json
                      echo
                      jq -r '.relevant_items[]? | "- [\(.status)] [\(.title)](\(.url))"' build/men-update-report.json
                      jq -r '.warnings[]? | "- Warning: \(.)"' build/men-update-report.json
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Commit generated schedule
              id: commit
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add resources/polish-winter-breaks.json
                  if git diff --cached --quiet; then
                      echo 'created=false' >> "$GITHUB_OUTPUT"
                  else
                      git commit -m 'chore: update MEN school holiday data'
                      git push --force-with-lease origin "$UPDATE_BRANCH"
                      echo 'created=true' >> "$GITHUB_OUTPUT"
                  fi

            - name: Create or refresh the data pull request
              if: steps.commit.outputs.created == 'true'
              run: |
                  body_file=$(mktemp)
                  {
                      echo 'Automated update generated from newly published MEN announcements.'
                      echo
                      echo "Messages were scanned after \`${{ steps.window.outputs.since }}\`."
                      echo
                      jq -r '.relevant_items[]? | "- [\(.status)] [\(.title)](\(.url))"' build/men-update-report.json
                      echo
                      echo 'The updater fetched the canonical gov.pl article, parsed the regional periods, and verified that all 16 voivodeships occur exactly once in fourteen-day ranges.'
                  } > "$body_file"
                  pr_number=$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')
                  if [ -z "$pr_number" ]; then
                      gh pr create \
                          --base "${{ github.event.repository.default_branch }}" \
                          --head "$UPDATE_BRANCH" \
                          --title 'chore: update MEN school holiday data' \
                          --body-file "$body_file"
                  else
                      gh pr edit "$pr_number" --body-file "$body_file"
                  fi

            - name: Open or update a manual-review issue
              if: ${{ fromJSON(steps.commit.outputs.created || 'false') || always() }}
              env:
                  REPORT_PATH: build/men-update-report.json
              run: |
                  if [ "$(jq -r '.requires_review' "$REPORT_PATH")" != 'true' ]; then
                      exit 0
                  fi
                  issue_title='MEN updater: manual review required'
                  body_file=$(mktemp)
                  {
                      echo "The weekly scan after \`${{ steps.window.outputs.since }}\` found announcements or a feed-coverage warning that cannot be converted safely."
                      echo
                      jq -r '.relevant_items[]? | select(.status == "review") | "- [\(.title)](\(.url))"' "$REPORT_PATH"
                      jq -r '.warnings[]? | "- \(.)"' "$REPORT_PATH"
                      echo
                      echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                  } > "$body_file"
                  issue_number=$(gh issue list --state open --search "\"$issue_title\" in:title" --json number,title --jq ".[] | select(.title == \"$issue_title\") | .number" | head -1)
                  if [ -z "$issue_number" ]; then
                      gh issue create --title "$issue_title" --body-file "$body_file"
                  else
                      gh issue comment "$issue_number" --body-file "$body_file"
                  fi
